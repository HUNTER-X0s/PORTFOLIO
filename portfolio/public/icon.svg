<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Void Glass Background -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D24"/>
      <stop offset="45%" stop-color="#030614"/>
      <stop offset="100%" stop-color="#010206"/>
    </linearGradient>

    <!-- Multi-stop Vibrant Neon Cyber Perimeter -->
    <linearGradient id="neonPerimeter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="30%" stop-color="#00A3FF"/>
      <stop offset="65%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>

    <!-- Left Wing (Electric Cyan to Cobalt) -->
    <linearGradient id="bladeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#5DF9FF"/>
      <stop offset="45%" stop-color="#00D2FF"/>
      <stop offset="80%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#09143C"/>
    </linearGradient>

    <!-- Right Wing (Neon Violet to Hot Cyber Magenta) -->
    <linearGradient id="bladeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#E879F9"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="75%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>

    <!-- High-Impact Specular Edge Sheen (Left) -->
    <linearGradient id="sheenLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#5DF9FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </linearGradient>

    <!-- High-Impact Specular Edge Sheen (Right) -->
    <linearGradient id="sheenRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FF77C6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <!-- Central Laser Energy Beam -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F5FF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="80%" stop-color="#FF007F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0"/>
    </linearGradient>

    <!-- Central Reactor Radiant Aura -->
    <radialGradient id="reactorAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#00F5FF" stop-opacity="1"/>
      <stop offset="65%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Nebula Backlight -->
    <radialGradient id="nebulaCore" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#010206" stop-opacity="0"/>
    </radialGradient>

    <!-- Clean Glow Filter -->
    <filter id="svgGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="coreFlare" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="bigBlur"/>
      <feGaussianBlur stdDeviation="4" result="sharpBlur"/>
      <feMerge>
        <feMergeNode in="bigBlur"/>
        <feMergeNode in="sharpBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Squircle Housing Base -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#cosmicBg)"/>

  <!-- 2. Radiant Internal Nebula Aura -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#nebulaCore)"/>

  <!-- 3. Outer Glowing Neon Perimeter Rim -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="none" stroke="url(#neonPerimeter)" stroke-width="14" stroke-opacity="0.95"/>
  <rect x="30" y="30" width="452" height="452" rx="114" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.3"/>

  <!-- 4. Corner Precision Tech Brackets -->
  <path d="M 84 58 L 58 58 C 50 58 46 62 46 70 L 46 96" stroke="#00F5FF" stroke-width="6" stroke-linecap="round" fill="none" stroke-opacity="0.9"/>
  <path d="M 428 58 L 454 58 C 462 58 466 62 466 70 L 466 96" stroke="#FF007F" stroke-width="6" stroke-linecap="round" fill="none" stroke-opacity="0.9"/>
  <path d="M 46 416 L 46 442 C 46 450 50 454 58 454 L 84 454" stroke="#00F5FF" stroke-width="6" stroke-linecap="round" fill="none" stroke-opacity="0.7"/>
  <path d="M 466 416 L 466 442 C 466 450 462 454 454 454 L 428 454" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round" fill="none" stroke-opacity="0.7"/>

  <!-- 5. Background Glow Behind Monogram (for strong silhouette punch at 16px) -->
  <path d="M 242 88 L 108 416 L 184 416 L 222 328 L 242 328 Z" fill="#00F5FF" opacity="0.4" filter="url(#coreFlare)"/>
  <path d="M 270 88 L 404 416 L 328 416 L 290 328 L 270 328 Z" fill="#A855F7" opacity="0.4" filter="url(#coreFlare)"/>

  <!-- 6. Monogram: Left Blade (Electric Cyan Cyber Blade) -->
  <path d="M 242 84 L 106 414 C 103 420 108 426 116 426 L 184 426 C 192 426 199 421 202 414 L 226 332 L 242 332 Z" fill="url(#bladeLeft)"/>
  <!-- Left Blade Bevel Reflection -->
  <path d="M 242 84 L 106 414 L 126 414 L 242 124 Z" fill="url(#sheenLeft)"/>

  <!-- 7. Monogram: Right Blade (Quantum Violet/Magenta Blade) -->
  <path d="M 270 84 L 406 414 C 409 420 404 426 396 426 L 328 426 C 320 426 313 421 310 414 L 286 332 L 270 332 Z" fill="url(#bladeRight)"/>
  <!-- Right Blade Bevel Reflection -->
  <path d="M 270 84 L 406 414 L 386 414 L 270 124 Z" fill="url(#sheenRight)"/>

  <!-- 8. Inner Triangle Guideline Tech Lines -->
  <path d="M 230 300 L 256 236 L 282 300" stroke="#00F5FF" stroke-width="3.5" stroke-opacity="0.6" fill="none"/>

  <!-- 9. Horizontal Quantum Laser Energy Crossbar -->
  <polygon points="138,284 374,284 362,300 150,300" fill="url(#laserBeam)" filter="url(#svgGlow)"/>
  <line x1="116" y1="292" x2="396" y2="292" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" filter="url(#svgGlow)"/>

  <!-- 10. Central Reactor Radiant Core Halo -->
  <circle cx="256" cy="292" r="42" fill="url(#reactorAura)"/>

  <!-- 11. Multi-Faceted Central Quantum Nexus Diamond -->
  <polygon points="256,256 292,292 256,328 220,292" fill="#030614" stroke="#00F5FF" stroke-width="5"/>
  <polygon points="256,264 282,292 256,320 230,292" fill="url(#neonPerimeter)"/>
  <polygon points="256,274 272,292 256,310 240,292" fill="#FFFFFF" filter="url(#svgGlow)"/>

  <!-- 12. Quantum Pulse Emitter Nodes -->
  <circle cx="196" cy="292" r="5" fill="#00F5FF" filter="url(#svgGlow)"/>
  <circle cx="316" cy="292" r="5" fill="#FF007F" filter="url(#svgGlow)"/>

  <!-- 13. Apex Photonic Flare (Laser Starlight Crown at Vertex) -->
  <circle cx="256" cy="86" r="22" fill="url(#reactorAura)"/>
  <ellipse cx="256" cy="86" rx="42" ry="6" fill="#FFFFFF" filter="url(#svgGlow)"/>
  <ellipse cx="256" cy="86" rx="6" ry="42" fill="#FFFFFF" filter="url(#svgGlow)"/>
  <circle cx="256" cy="86" r="6" fill="#FFFFFF"/>
</svg>
