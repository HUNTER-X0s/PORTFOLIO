version: '3.9'

# ── This file mirrors the root docker-compose.yml
# ── Run from project root: docker-compose -f docker/docker-compose.yml up
# ── All paths are relative to the REPOSITORY ROOT (../), not this folder.

services:
  # ── MongoDB ──────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: portfolio-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-changeme}
      MONGO_INITDB_DATABASE: portfolio
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Express Backend ───────────────────────────────────────────
  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    env_file: ../server/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-changeme}@mongodb:27017/portfolio?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
    volumes:
      - ../server/uploads:/app/uploads
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── RAG Chatbot Backend ───────────────────────────────────────
  chatbot:
    build:
      context: ../rag-chatbot
      dockerfile: Dockerfile
    container_name: portfolio-chatbot
    restart: unless-stopped
    env_file: ../rag-chatbot/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      ENV: production
      USE_OLLAMA_EMBED: "false"
      CHROMA_PERSIST_DIR: /app/chroma_db
      CACHE_DIR: /app/cache
    volumes:
      - ../rag-chatbot/chroma_db:/app/chroma_db
      - ../rag-chatbot/cache:/app/cache
    ports:
      - "8001:8001"
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8001/api/health || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 120s
      retries: 3

  # ── Next.js Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ../portfolio
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
        NEXT_PUBLIC_CHATBOT_URL: ${NEXT_PUBLIC_CHATBOT_URL:-http://localhost:8001}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://anurag07.vercel.app}
        NEXT_PUBLIC_GITHUB_USERNAME: HUNTER-X0s
    container_name: portfolio-frontend
    restart: unless-stopped
    env_file: ../portfolio/.env.local
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Admin Panel ───────────────────────────────────────────────
  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    container_name: portfolio-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
      - chatbot
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo_data:
  redis_data:

networks:
  portfolio-net:
    driver: bridge
