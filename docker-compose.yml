version: '3.9'

services:
  # ── MongoDB ──────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: portfolio-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-changeme}
      MONGO_INITDB_DATABASE: portfolio
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Redis (session/cache) ────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 30s
      timeout: 5s

  # ── Express Backend ───────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-changeme}@mongodb:27017/portfolio?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
    volumes:
      - ./server/uploads:/app/uploads
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── RAG Chatbot Backend ───────────────────────────────────────
  chatbot:
    build:
      context: ./rag-chatbot
      dockerfile: Dockerfile
    container_name: portfolio-chatbot
    restart: unless-stopped
    env_file: ./rag-chatbot/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_PERSIST_DIR: /app/chroma_db
    volumes:
      - ./rag-chatbot/chroma_db:/app/chroma_db
    ports:
      - "8001:8001"
    depends_on:
      - ollama
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8001/api/health || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

  # ── Ollama (Local LLM) ────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: portfolio-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - portfolio-net
    # GPU support (uncomment if GPU available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Next.js Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./portfolio
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
        NEXT_PUBLIC_CHATBOT_URL: ${NEXT_PUBLIC_CHATBOT_URL:-http://localhost:8001}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://anuragswain.dev}
        NEXT_PUBLIC_GITHUB_USERNAME: HUNTER-X0s
    container_name: portfolio-frontend
    restart: unless-stopped
    env_file: ./portfolio/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s

  # ── Admin Panel ───────────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    container_name: portfolio-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - portfolio-net

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
      - chatbot
    networks:
      - portfolio-net

volumes:
  mongo_data:
  redis_data:
  ollama_data:

networks:
  portfolio-net:
    driver: bridge
